<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div{
            background-color: yellow;
            width: 200px;
            height: 200px;

            margin-bottom: 20px;
        }

        button{
            padding: 5px 40px;
        }
    </style>
    <title>GetElements</title>
</head>
<body>
    <h1>GetElementByID</h1>

    <div id="quadrado" onclick="mudarCorDiv()">OI</div>

    <button onclick="resetar()" id="reset">Reset</button>
    <script>
        function mudarCorDiv(){
            document.getElementById('quadrado').style.backgroundColor = 'orange'
        }

        function resetar(){
            document.getElementById('quadrado').style.backgroundColor = 'yellow'
        }
    </script>
</body>
</html>
