<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div{
            background-color: pink;
            width: 200px;
            height: 200px;
            text-align: center;
            transition: 0.5s ease;
            margin: 10px;
        }

        div:hover{
            width: 250px;
            height: 250px;
            transform: scaleY(1);
            font-size: 40px;
        }

        .primeiro:hover{
            background-color: rgb(65, 226, 50);
        }

        .segundo:hover{
            background-color: rgb(230, 58, 36);
        }

        .terceiro:hover{
            background-color: rgb(26, 85, 196);
        }
    </style>
    <title>Pseudo-Classes</title>
</head>
<body>
    <div class="primeiro">VERDE</div>
    <div class="segundo">VERMELHO</div>
    <div class="terceiro">AZUL</div>
</body>
</html>
