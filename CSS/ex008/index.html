<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            background-color: pink;
            display: flex;
            flex-direction: column-reverse;
        }

        .container > div {
            background-color: rgb(95, 142, 243);
            border: 1px solid black;
            padding: 10px;
            flex: auto;
            text-align: center;
        }
    </style>
    <title>Flexbox</title>
</head>

<body>
    <div class="container">
        <div>Exemplo item A</div>
        <div>Exemplo item B</div>
        <div>Exemplo item C</div>
        <div>Exemplo item D</div>
    </div>
</body>

</html>
